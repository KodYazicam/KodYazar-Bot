name: kodyazar-bot

services:
  bot:
    build: .
    image: kodyazar-bot:local
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      # Publish the same port the container listens on. Compose interpolates
      # this from the project .env (or the shell); PORT=0 is not supported here
      # because an ephemeral container port cannot be published reliably.
      PORT: ${PORT:-3000}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - bot-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  bot-data:
